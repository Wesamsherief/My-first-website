<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <title>Wesam Sherief</title>
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- Custom CSS & Fonts -->
        <link href="style1.css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Sofia|Trirong">

        <!-- JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                document.getElementById("aboutCard").addEventListener("click", function(e) {
                    e.preventDefault();
                    if (confirm("Go to next page?")) {
                        window.location.href = "About.html";
                    }
                });
            });
        </script>
    </head>
    <body class="body min-vh-100 d-flex flex-column justify-content-between">
        
        <!-- Header -->
        <header class="header text-center my-auto pt-4">
            <h1>Wesam Sherief</h1>
        </header>

        <!-- Main Content (Centered vertically and horizontally) -->
        <main class="container my-auto">
            <div class="row g-4 justify-content-center align-items-center">
                
                <!-- Personal Info Card -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column text-center">
                            <h5 class="card-title fw-bold">Personal Info</h5>
                            <p class="card-text flex-grow-1">Learn more about my personal background and details.</p>
                            <a href="info.html" class="btn btn-primary mt-auto">My Personal Info</a>
                        </div>
                    </div>
                </div>

                <!-- Hobbies Card -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column text-center">
                            <h5 class="card-title fw-bold">Hobbies</h5>
                            <p class="card-text flex-grow-1">Explore my passions, interests, and favorite activities.</p>
                            <a href="hobbies.html" class="btn btn-primary mt-auto">My Hobbies</a>
                        </div>
                    </div>
                </div>

                <!-- About Card -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column text-center">
                            <h5 class="card-title fw-bold">About</h5>
                            <p class="card-text flex-grow-1">Read more details about who I am and what I do.</p>
                            <a href="About.html" id="aboutCard" class="btn btn-primary mt-auto">About</a>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center py-3 text-muted my-auto">
            <p class="m-0">&copy; Wesam Sherief</p>
        </footer>
    </body>
</html>
